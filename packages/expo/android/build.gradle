plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'dev.pushharbor.expo'
version = '0.2.0'

android {
  namespace "dev.pushharbor.expo"
  defaultConfig {
    versionCode 1
    versionName "0.2.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // The pushharbor-android library, bundled in this package as android-lib/ (expo-module.config.json).
  implementation project(':pushharbor-android')
}
