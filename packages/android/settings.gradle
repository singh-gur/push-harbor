// Standalone build of the library (tests, native example, publishing). Inside an app the same
// build.gradle is included as a subproject and takes plugin versions from the app.
pluginManagement {
  repositories {
    google()
    mavenCentral()
    gradlePluginPortal()
  }
  plugins {
    id 'com.android.library' version '9.2.1'
    id 'org.jetbrains.kotlin.android' version '2.2.0'
  }
}

dependencyResolutionManagement {
  repositories {
    google()
    mavenCentral()
  }
}

rootProject.name = 'pushharbor-android'
