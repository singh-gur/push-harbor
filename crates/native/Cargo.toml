[package]
name = "pushharbor-native"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
description = "Pushharbor relay server: Web Push compatible push notifications for self-hosted apps, end-to-end encrypted, with SQLite or PostgreSQL"
keywords = ["web-push", "push-notifications", "relay", "fcm", "self-hosted"]
categories = ["web-programming::http-server", "network-programming", "command-line-utilities"]

[dependencies]
aws-lc-rs = "1.19.0"
axum = "0.8.9"
pushharbor-core = { version = "0.1.0", path = "../core" }
reqwest = "0.13.5"
serde_json = "1.0.154"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros", "postgres", "any"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "time", "signal", "sync"] }
tower-http = { version = "0.7.1", features = ["timeout", "limit"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
