[package]
name = "pushharbor-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
description = "Pushharbor protocol core: Web Push (RFC 8030/8291/8292) validation, VAPID binding, challenge registration and FCM delivery for a push relay, without I/O (native and wasm32)"
keywords = ["web-push", "push-notifications", "vapid", "fcm", "relay"]
categories = ["network-programming", "web-programming", "wasm", "cryptography"]
# Tests and examples read the spec's test vectors from outside the crate (docs/spec/vectors).
exclude = ["tests/", "examples/"]

[dependencies]
base64 = { version = "0.23.1", default-features = false, features = ["alloc"] }
p256 = { version = "0.14.0", default-features = false, features = ["ecdsa"] }
serde = { version = "1.0.229", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1.0.154", default-features = false, features = ["alloc"] }

[dev-dependencies]
aes-gcm = "0.11.1"
hkdf = "0.13.0"
p256 = { version = "0.14.0", default-features = false, features = ["ecdh", "arithmetic"] }
pollster = "1.0.1"
sha2 = "0.11.1"

[features]
# In-memory adapter implementations for tests (core and adapters).
fakes = []
