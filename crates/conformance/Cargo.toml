[package]
name = "pushharbor-conformance"
description = "Black-box HTTP suite every Pushharbor hosting configuration must pass"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
axum = "0.8.9"
base64 = "0.23.1"
getrandom = "0.4.3"
p256 = { version = "0.14.0", default-features = false, features = ["ecdsa"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
