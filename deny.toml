# cargo-deny (PH-24): `cargo deny check` in CI. Advisories fail the build; licenses must be
# permissive (compatible with shipping MIT binaries and the Docker image).

[graph]
all-features = true

[advisories]
yanked = "deny"
# shortcut: no sqlx release accepts libsqlite3-sys >= 0.39 yet (fix merged as launchbadge/sqlx#4502,
# unreleased); remove this and upgrade sqlx when it ships (PH-40).
ignore = [
    { id = "RUSTSEC-2026-0459", reason = "needs an attacker-written SQLite db + -wal pair; the relay opens only its own database; no sqlx release with libsqlite3-sys >= 0.39 yet" },
]

[licenses]
confidence-threshold = 0.9
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "BSL-1.0",
    "CC0-1.0",
    "Unlicense",
    # webpki-roots / Mozilla CA data
    "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
