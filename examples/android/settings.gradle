pluginManagement {
  repositories {
    google()
    mavenCentral()
    gradlePluginPortal()
  }
  plugins {
    id 'com.android.application' version '9.2.1'
    id 'com.android.library' version '9.2.1'
    id 'org.jetbrains.kotlin.android' version '2.2.0'
    id 'com.google.gms.google-services' version '4.4.4'
  }
}

dependencyResolutionManagement {
  repositories {
    google()
    mavenCentral()
  }
}

rootProject.name = 'pushharbor-native-example'
include ':app'
// The library from this repository; apps outside it use the published artifact (docs/android.md).
include ':pushharbor-android'
project(':pushharbor-android').projectDir = file('../../packages/android')
