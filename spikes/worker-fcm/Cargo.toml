[package]
name = "pushharbor-worker-fcm-spike"
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false

# Standalone: not part of the root workspace.
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
base64 = "0.23.1"
pushharbor-core = { version = "0.0.0", path = "../../crates/core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
worker = "0.8"
worker-macros = "0.8"
