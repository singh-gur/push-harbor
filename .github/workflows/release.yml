name: Release

# On a version tag (v0.1.0): the container image to GHCR (:0.1.0, :0.1, :latest), the crates
# pushharbor-core and pushharbor-native to crates.io, @pushharbor/expo to npm, and
# io.github.singh-gur:pushharbor-android to Maven Central. crates.io and npm use trusted
# publishing (OIDC, no stored tokens); Maven Central has none, so it uses the user token and PGP
# key stored as `release` environment secrets. Publishing waits for approval in the `release`
# environment. Versions already on a registry are skipped, so re-running is safe.
# Manual runs only build the image, without pushing it; with `maven_dry_run` they also upload the
# Android library to Maven Central under a throwaway -dryrun version, wait for validation and
# drop it again (nothing is published). The `release` environment only accepts `v*` tags, so start
# a dry run on a throwaway tag (e.g. v0.1.0-dryrun.1; its own tag-push run fails at the version
# check before publishing anything) and delete the tag afterwards.
#
# Jobs that can publish never install or compile third-party code (no npm install scripts, no
# build.rs, no Gradle): unprivileged jobs build and verify, the publish jobs only sign and upload.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      maven_dry_run:
        description: Upload the Android library to Maven Central for validation only, then drop it
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: startsWith(github.ref, 'refs/tags/v')
        run: scripts/check-release-version.sh "$GITHUB_REF_NAME"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          # Nothing in this job may come from the Actions cache (see no-cache below).
          cache-binary: false
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/pushharbor-native
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # shortcut: linux/amd64 only; add linux/arm64 (QEMU or an arm runner) when someone needs it.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # No build cache on purpose: caches are shared with every workflow run on main, so a
          # release built from cache could include anything a CI job managed to write there.
          no-cache: true

  # Unprivileged: package and fully verify the crates (this compiles dependencies).
  crates-verify:
    if: startsWith(github.ref, 'refs/tags/v') && !inputs.maven_dry_run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: stable
      - run: scripts/check-release-version.sh "$GITHUB_REF_NAME"
      - run: cargo package --locked -p pushharbor-core -p pushharbor-native

  crates-publish:
    needs: crates-verify
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: stable
      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        id: auth
      # --no-verify: verified above; here cargo only packages and uploads (no build scripts run).
      - name: Publish (skipping versions already on crates.io)
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          version=${GITHUB_REF_NAME#v}
          for crate in pushharbor-core pushharbor-native; do
            status=$(curl -s -o /dev/null -w '%{http_code}' -H 'User-Agent: pushharbor-release (github.com/singh-gur/push-harbor)' \
              "https://crates.io/api/v1/crates/$crate/$version")
            if [ "$status" = 200 ]; then echo "$crate $version already published"; continue; fi
            cargo publish --no-verify --locked -p "$crate"
          done

  # Unprivileged: install dev dependencies, build and pack the npm package.
  npm-pack:
    if: startsWith(github.ref, 'refs/tags/v') && !inputs.maven_dry_run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: scripts/check-release-version.sh "$GITHUB_REF_NAME"
      - working-directory: packages/expo
        run: npm ci && npm pack
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-package
          path: packages/expo/pushharbor-expo-*.tgz
          if-no-files-found: error

  npm-publish:
    needs: npm-pack
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-package
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm >= 11.5.1; provenance is attached automatically.
      - run: npm install -g npm@11.19.1
      - name: Publish (skipping a version already on npm)
        run: |
          version=${GITHUB_REF_NAME#v}
          if npm view "@pushharbor/expo@$version" version >/dev/null 2>&1; then
            echo "@pushharbor/expo $version already published"
          else
            npm publish "./pushharbor-expo-$version.tgz"
          fi

  # Unprivileged: build the Android library's Maven bundle with Gradle (unsigned; this compiles
  # dependencies). A dry run builds a throwaway <version>-dryrun.<run> instead.
  maven-pack:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.maven_dry_run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 17
      - if: startsWith(github.ref, 'refs/tags/v') && !inputs.maven_dry_run
        run: scripts/check-release-version.sh "$GITHUB_REF_NAME"
      - name: Build the bundle
        working-directory: packages/android
        env:
          DRY_RUN: ${{ inputs.maven_dry_run }}
        run: |
          version=$(sed -n 's/^VERSION_NAME=//p' gradle.properties)
          if [ "$DRY_RUN" = true ]; then version="$version-dryrun.$GITHUB_RUN_NUMBER"; fi
          ./gradlew -q publishReleasePublicationToBundleRepository "-PVERSION_NAME=$version"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: maven-bundle
          path: packages/android/build/central-bundle
          if-no-files-found: error

  # Signs the bundle with the release key and uploads it through the Central Portal API
  # (central.sonatype.org/publish/publish-portal-api). Only runner tools: gpg, zip, curl, jq.
  maven-publish:
    needs: maven-pack
    if: startsWith(github.ref, 'refs/tags/v') || inputs.maven_dry_run
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: maven-bundle
          path: bundle
      - name: Sign, upload and publish (skipping a version already on Maven Central)
        env:
          DRY_RUN: ${{ inputs.maven_dry_run }}
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          path=io/github/singh-gur/pushharbor-android
          version=$(find "bundle/$path" -mindepth 1 -maxdepth 1 -type d -printf '%f\n')
          [ "$(printf '%s\n' "$version" | wc -l)" = 1 ] || { echo "expected one version in the bundle: $version"; exit 1; }
          if [ "$DRY_RUN" != true ] &&
            curl -sfI "https://repo1.maven.org/maven2/$path/$version/pushharbor-android-$version.pom" >/dev/null; then
            echo "pushharbor-android $version already published"; exit 0
          fi

          # Every file needs an .asc signature; checksums need none. Central rejects maven-metadata.
          GNUPGHOME=$(mktemp -d)
          export GNUPGHOME
          printf '%s\n' "$GPG_PRIVATE_KEY" | gpg --batch --quiet --import
          rm -f "bundle/$path"/maven-metadata.xml*
          find bundle -type f ! -name '*.md5' ! -name '*.sha1' ! -name '*.sha256' ! -name '*.sha512' -print0 |
            while IFS= read -r -d '' f; do
              printf '%s' "$GPG_PASSPHRASE" |
                gpg --batch --quiet --yes --pinentry-mode loopback --passphrase-fd 0 --armor --detach-sign "$f"
            done
          (cd bundle && zip -qr ../central-bundle.zip .)

          token=$(printf '%s:%s' "$MAVEN_CENTRAL_USERNAME" "$MAVEN_CENTRAL_PASSWORD" | base64 -w0)
          echo "::add-mask::$token"
          api=https://central.sonatype.com/api/v1/publisher
          if [ "$DRY_RUN" = true ]; then type=USER_MANAGED; else type=AUTOMATIC; fi
          id=$(curl -sS --fail-with-body -H "Authorization: Bearer $token" -F "bundle=@central-bundle.zip" \
            "$api/upload?publishingType=$type&name=pushharbor-android-$version")
          echo "pushharbor-android $version: deployment $id ($type)"

          # Validation takes minutes; publishing to Maven Central can take up to ~30 min.
          state=PENDING
          for _ in $(seq 120); do
            sleep 15
            status=$(curl -sS --fail-with-body -X POST -H "Authorization: Bearer $token" "$api/status?id=$id")
            state=$(jq -r .deploymentState <<<"$status")
            echo "state: $state"
            case "$state" in
              FAILED) jq .errors <<<"$status"; exit 1 ;;
              PUBLISHED) exit 0 ;;
              VALIDATED)
                if [ "$DRY_RUN" = true ]; then
                  curl -sS --fail-with-body -X DELETE -H "Authorization: Bearer $token" "$api/deployment/$id"
                  echo "dry run passed validation; deployment dropped"; exit 0
                fi ;;
            esac
          done
          if [ "$state" = PUBLISHING ]; then
            echo "still publishing after 30 min; see https://central.sonatype.com/publishing/deployments"; exit 0
          fi
          echo "timed out in state $state"; exit 1
