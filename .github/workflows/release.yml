name: Release

# On a version tag (v0.1.0): the container image to GHCR (:0.1.0, :0.1, :latest), the crates
# pushharbor-core and pushharbor-native to crates.io, and @pushharbor/expo to npm. Registry
# publishing uses trusted publishing (OIDC, no stored tokens) and waits for approval in the
# `release` environment. Versions already on a registry are skipped, so re-running is safe.
# Manual runs only build the image, without pushing it.
#
# Jobs that can publish never install or compile third-party code (no npm install scripts, no
# build.rs): unprivileged jobs build and verify, the publish jobs only upload the result.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: startsWith(github.ref, 'refs/tags/v')
        run: scripts/check-release-version.sh "$GITHUB_REF_NAME"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          # Nothing in this job may come from the Actions cache (see no-cache below).
          cache-binary: false
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/pushharbor-native
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # shortcut: linux/amd64 only; add linux/arm64 (QEMU or an arm runner) when someone needs it.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # No build cache on purpose: caches are shared with every workflow run on main, so a
          # release built from cache could include anything a CI job managed to write there.
          no-cache: true

  # Unprivileged: package and fully verify the crates (this compiles dependencies).
  crates-verify:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: stable
      - run: scripts/check-release-version.sh "$GITHUB_REF_NAME"
      - run: cargo package --locked -p pushharbor-core -p pushharbor-native

  crates-publish:
    needs: crates-verify
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: stable
      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        id: auth
      # --no-verify: verified above; here cargo only packages and uploads (no build scripts run).
      - name: Publish (skipping versions already on crates.io)
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          version=${GITHUB_REF_NAME#v}
          for crate in pushharbor-core pushharbor-native; do
            status=$(curl -s -o /dev/null -w '%{http_code}' -H 'User-Agent: pushharbor-release (github.com/singh-gur/push-harbor)' \
              "https://crates.io/api/v1/crates/$crate/$version")
            if [ "$status" = 200 ]; then echo "$crate $version already published"; continue; fi
            cargo publish --no-verify --locked -p "$crate"
          done

  # Unprivileged: install dev dependencies, build and pack the npm package.
  npm-pack:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: scripts/check-release-version.sh "$GITHUB_REF_NAME"
      - working-directory: packages/expo
        run: npm ci && npm pack
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-package
          path: packages/expo/pushharbor-expo-*.tgz
          if-no-files-found: error

  npm-publish:
    needs: npm-pack
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-package
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm >= 11.5.1; provenance is attached automatically.
      - run: npm install -g npm@11.19.1
      - name: Publish (skipping a version already on npm)
        run: |
          version=${GITHUB_REF_NAME#v}
          if npm view "@pushharbor/expo@$version" version >/dev/null 2>&1; then
            echo "@pushharbor/expo $version already published"
          else
            npm publish "./pushharbor-expo-$version.tgz"
          fi
