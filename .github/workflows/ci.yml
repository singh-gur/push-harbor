name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown, wasm32-wasip1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo test -p pushharbor-core --target wasm32-wasip1
        env:
          CARGO_TARGET_WASM32_WASIP1_RUNNER: node --no-warnings ${{ github.workspace }}/scripts/wasi-run.mjs
      - run: cargo build -p pushharbor-core -p pushharbor-worker --target wasm32-unknown-unknown

  # The shared conformance suite (crates/conformance) against each hosting configuration.
  conformance:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        config: [native]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - run: just conformance-${{ matrix.config }}

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t pushharbor-native:ci .
      - run: docker run --rm pushharbor-native:ci --help

  # Unmodified Web Push libraries sending to the native relay (PH-22).
  interop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/setup-go@v7
        with:
          go-version-file: interop/go/go.mod
          cache-dependency-path: interop/go/go.sum
      - uses: astral-sh/setup-uv@v10.3.3
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - run: just interop-native

  # Expo module: TypeScript build and Kotlin unit tests against docs/spec/vectors (PH-7).
  expo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - run: just test-expo
