# Smoke-test overrides (just deploy-test-compose): the locally built image on the host network,
# configured per the conformance contract, so the suite and its fake FCM can reach it. Caddy
# serves https://localhost:8443 with its internal CA.
services:
  relay:
    image: pushharbor-native:dev
    network_mode: host
    environment:
      PUSHHARBOR_ORIGIN: http://127.0.0.1:8080
      PUSHHARBOR_LISTEN: 127.0.0.1:8080
      PUSHHARBOR_TRUST_PROXY: "0"
      PUSHHARBOR_FCM_API_BASE: http://127.0.0.1:9790
      PUSHHARBOR_PROVIDER_TIMEOUT_SECS: "5"
      PUSHHARBOR_REQUEST_TIMEOUT_SECS: "8"
      PUSHHARBOR_ADMIN_TOKEN: conformance-admin-token-not-a-secret-0123456789
      PUSHHARBOR_LIMIT_GLOBAL: 1000000/60
      PUSHHARBOR_LIMIT_PER_IP: 1000000/60
      PUSHHARBOR_LIMIT_PER_SENDER: 10/60
      PUSHHARBOR_LIMIT_PER_ENDPOINT: 5/60
      PUSHHARBOR_LIMIT_REGISTRATIONS_PER_IP: 1000000/3600
      PUSHHARBOR_LIMIT_CHALLENGES_PER_TARGET: 5/3600
  caddy:
    network_mode: host
    ports: !reset []
    environment:
      PUSHHARBOR_DOMAIN: localhost:8443
      PUSHHARBOR_UPSTREAM: 127.0.0.1:8080
